name: Professional gift-specific public preview
on:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/gift-specific-public-preview*.mjs'
      - 'Professional/gift-specific-option-b-view*.mjs'
      - 'Professional/render-option-b-recipient-page*.mjs'
      - 'Professional/public-retail-schedule-verify*.mjs'
      - 'Professional/gift-specific-release-boundary*.mjs'
      - 'Professional/gift-specific-funding-binding*.mjs'
      - 'Professional/gift-specific-core-utxo-gate*.mjs'
      - 'Professional/gift-specific-core-continuity*.mjs'
      - 'Professional/gift-specific-cltv-maturity*.mjs'
      - 'Professional/gift-specific-recipient-release-gate*.mjs'
      - 'Professional/gift-link-public-candidate.mjs'
      - '.github/workflows/professional-gift-specific-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7
      - name: Check fail-closed public preview
        run: |
          node Professional/gift-specific-public-preview.check.mjs
          node Professional/gift-specific-release-boundary.check.mjs
          node Professional/gift-specific-funding-binding.check.mjs
          node Professional/gift-specific-core-utxo-gate.check.mjs
          node Professional/gift-specific-core-continuity.check.mjs
          node Professional/gift-specific-cltv-maturity.check.mjs
          node Professional/gift-specific-recipient-release-gate.check.mjs
          node Professional/gift-specific-option-b-view.check.mjs
          node Professional/render-option-b-recipient-page.check.mjs
          node Professional/public-retail-schedule-verify.check.mjs
