name: Professional Bitcoin Core regtest validation
on:
  workflow_dispatch:
  push:
    branches:
      - professional/isolated-release-prototype
    paths:
      - 'Professional/bitcoin-core-regtest-acceptance.mjs'
      - 'Professional/integrated-public-regtest-acceptance.mjs'
      - 'Professional/integrated-calendar-timestamp-core-acceptance.mjs'
      - 'Professional/option-b-two-funded-core-acceptance.mjs'
      - 'Professional/verify-calendar-jade-return.mjs'
      - 'Professional/locally-verified-beneficiary-review.mjs'
      - 'Professional/funded-calendar-recipient-view.mjs'
      - 'Professional/render-funded-calendar-recipient-section.mjs'
      - 'Professional/reviewed-funded-recipient-qr.mjs'
      - '.github/workflows/professional-bitcoin-core-regtest.yml'
permissions:
  contents: read
jobs:
  regtest-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test-only libraries
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @noble/curves@1.9.7 @ngraveio/bc-ur@1.1.13 cbor@9.0.2 qrcode@1.5.4 playwright@1.58.2
      - name: Start disposable Bitcoin Core regtest (no mainnet network)
        run: |
          docker run -d --name professional-bitcoin-regtest --network host \
            -v "$PWD/Professional:/fixture:ro" \
            ruimarinho/bitcoin-core:28 \
            -regtest -server -txindex=1 -rpcuser=professional -rpcpassword=synthetic-only \
            -rpcbind=127.0.0.1 -rpcallowip=127.0.0.1 -fallbackfee=0.00001
          # Runner is ephemeral; RPC is bound only to localhost, never publicly exposed.
      - name: Execute Bitcoin Core script acceptance tests
        run: node Professional/bitcoin-core-regtest-acceptance.mjs
      - name: Restart disposable regtest with fresh chain for integrated public-only test
        run: |
          docker rm -f professional-bitcoin-regtest
          docker run -d --name professional-bitcoin-regtest --network host \
            ruimarinho/bitcoin-core:28 \
            -regtest -server -txindex=1 -rpcuser=professional -rpcpassword=synthetic-only \
            -rpcbind=127.0.0.1 -rpcallowip=127.0.0.1 -fallbackfee=0.00001
      - name: Execute integrated Professional public-only funded regtest acceptance
        run: node Professional/integrated-public-regtest-acceptance.mjs

      - name: Execute genuine calendar-timestamp CLTV regtest acceptance
        run: node Professional/integrated-calendar-timestamp-core-acceptance.mjs

      - name: Check offline Jade signed-return verifier syntax
        run: node --check Professional/verify-calendar-jade-return.mjs
      - name: Install isolated Chromium
        run: npx --prefix Professional playwright install chromium
      - name: Verify genuine two-output Option B funded gift link with Bitcoin Core
        run: node Professional/option-b-two-funded-core-acceptance.mjs
      - name: Reject genuine Jade signature from another gift at calendar return CLI
        run: |
          if node Professional/verify-calendar-jade-return.mjs \
            Professional/artifacts/two-release-calendar-jade-handoff.json \
            "Professional/bc1q21_Jade_Signed_PSBT_QR_frames (7).txt" > /tmp/professional-wrong-gift.log 2>&1; then
            echo "Wrong-gift Jade signature was incorrectly accepted"
            exit 1
          fi
          grep -E "Professional signature verification:|Professional signed PSBT|signed PSBT|PSBT" /tmp/professional-wrong-gift.log
      - name: Capture disposable regtest chain for the same funded gift
        run: |
          docker stop professional-bitcoin-regtest
          mkdir -p Professional/artifacts/calendar-regtest-chain
          docker cp professional-bitcoin-regtest:/home/bitcoin/.bitcoin/regtest/. Professional/artifacts/calendar-regtest-chain/
          test -d Professional/artifacts/calendar-regtest-chain/blocks
          test -d Professional/artifacts/calendar-regtest-chain/chainstate
      - name: Save public calendar handoff
        uses: actions/upload-artifact@v4
        with:
          name: professional-calendar-regtest-public-handoff
          path: |
            Professional/artifacts/two-release-calendar-jade-handoff.json
            Professional/artifacts/calendar-regtest-chain/
          retention-days: 7
