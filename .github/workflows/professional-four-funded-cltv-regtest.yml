name: Professional four funded public CLTV regtest outputs
on:
  push:
    branches:
      - professional/isolated-release-prototype
    paths:
      - '.github/workflows/professional-four-funded-cltv-regtest.yml'
      - 'Professional/four-funded-public-cltv-regtest.mjs'
      - 'Professional/four-staged-software-cltv-regtest.mjs'
permissions:
  contents: read
jobs:
  four-funded-public-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install public-only dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @noble/curves@1.9.7
      - name: Start disposable Bitcoin Core 28 regtest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/professional-four-funded-chain"
          docker run -d --name professional-four-funded --network host \
            -v "$RUNNER_TEMP/professional-four-funded-chain:/regtestdata" \
            --entrypoint bitcoind ruimarinho/bitcoin-core:28 \
            -regtest -server -datadir=/regtestdata -fallbackfee=0.0001 \
            -rpcuser=professional -rpcpassword=synthetic-only \
            -rpcbind=127.0.0.1 -rpcallowip=127.0.0.1
          for i in $(seq 1 40); do
            if docker exec professional-four-funded bitcoin-cli -regtest -datadir=/regtestdata -rpcuser=professional -rpcpassword=synthetic-only getblockchaininfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec professional-four-funded bitcoin-cli -regtest -datadir=/regtestdata -rpcuser=professional -rpcpassword=synthetic-only createwallet professional-initial-miner
          ADDRESS=$(docker exec professional-four-funded bitcoin-cli -regtest -datadir=/regtestdata -rpcuser=professional -rpcpassword=synthetic-only -rpcwallet=professional-initial-miner getnewaddress)
          docker exec professional-four-funded bitcoin-cli -regtest -datadir=/regtestdata -rpcuser=professional -rpcpassword=synthetic-only generatetoaddress 121 "$ADDRESS" >/dev/null
      - name: Verify four funded confirmed distinct public CLTV P2SH outputs
        run: node Professional/four-funded-public-cltv-regtest.mjs
      - name: Verify four independently staged software-signed CLTV releases
        run: node Professional/four-staged-software-cltv-regtest.mjs
      - name: Remove disposable regtest
        if: always()
        run: docker rm -f professional-four-funded 2>/dev/null || true
