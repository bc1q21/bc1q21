name: Professional captured Jade public-origin verification
on:
  workflow_dispatch:
  push:
    branches:
      - professional/isolated-release-prototype
    paths:
      - 'Professional/regtest-jade-public-fixture.mjs'
      - '.github/workflows/professional-jade-public-origin.yml'
permissions:
  contents: read
jobs:
  public-only-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test-only Bitcoin PSBT decoder
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7
      - name: Assert recorded Jade public signer origin only
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {getCapturedJadePublicFixture} from './Professional/regtest-jade-public-fixture.mjs';
          const f=getCapturedJadePublicFixture();
          assert.match(f.pubkeyHex,/^(02|03)[0-9a-f]{64}$/);
          assert.match(f.masterFingerprintHex,/^[0-9a-f]{8}$/);
          assert.ok(f.derivationPath.length>=1);
          assert.ok(f.derivationPath.every(n=>Number.isInteger(n)&&n>=0&&n<=0xffffffff));
          console.log('PASS: recorded disposable Jade V7 public key, fingerprint and derivation origin decoded');
          console.log('No private material, device operation, regtest transaction or production use');
          NODE
