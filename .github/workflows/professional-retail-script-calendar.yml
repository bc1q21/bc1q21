name: Professional retail calendar to public CLTV consistency
on:
  workflow_dispatch:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/test-retail-dates-public-scripts.mjs'
      - '.github/workflows/professional-retail-script-calendar.yml'
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install public-only BIP32 fixture helper
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional @scure/bip32@1.7.0
      - name: Verify retail rollover schedules reproduce the intended CLTV scripts
        run: node Professional/test-retail-dates-public-scripts.mjs
