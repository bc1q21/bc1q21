name: Professional same-gift Jade browser evidence
on:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/same-gift-jade-browser-evidence.check.mjs'
      - 'Professional/same-gift-jade-camera-browser.check.mjs'
      - 'Professional/browser-process-shim.cjs'
      - 'Professional/browser-buffer-shim.cjs'
      - 'Professional/original-funded-24-public-binding.check.mjs'
      - 'Professional/historical-funded-gift-view.mjs'
      - 'Professional/historical-funded-gift-view.check.mjs'
      - 'Professional/funded-gift-calendar-attachment.mjs'
      - 'Professional/funded-gift-calendar-attachment.check.mjs'
      - 'Professional/fixtures/original-funded-24-public-evidence.json'
      - 'Professional/fixtures/same-gift-unsigned-handoff.json'
      - '.github/workflows/professional-same-gift-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  same-gift-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install test-only dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @ngraveio/bc-ur@1.1.13 cbor@9.0.2 qrcode@1.5.4 playwright@1.58.2 esbuild@0.25.12 jsqr@1.4.0 @noble/curves@1.9.7 buffer@6.0.3
      - name: Reject unsupported calendar claims on historical height-CLTV gift
        run: node Professional/funded-gift-calendar-attachment.check.mjs
      - name: Validate read-only original funded gift-link preview
        run: node Professional/historical-funded-gift-view.check.mjs
      - name: Bind historical public gift locator to all 24 original funded outputs
        run: node Professional/original-funded-24-public-binding.check.mjs
      - name: Audit permanently preserved original funded regtest handoff
        run: node Professional/audit-same-gift-unsigned-handoff.mjs Professional/fixtures/same-gift-unsigned-handoff.json
      - name: Verify recipient release integration bundles for Chromium
        run: node --test Professional/recipient-browser-bundle.check.mjs
      - name: Install isolated Chromium
        run: npx --prefix Professional playwright install chromium
      - name: Browser-test exact same-gift unsigned QR and captured Jade signature
        run: node Professional/same-gift-jade-browser-evidence.check.mjs "Professional/fixtures/same-gift-unsigned-handoff.json" "Professional/bc1q21_Jade_Signed_PSBT_QR_frames (7).txt"
      - name: Decode captured Jade signed QR records in recipient browser camera
        run: node Professional/same-gift-jade-camera-browser.check.mjs "Professional/fixtures/same-gift-unsigned-handoff.json" "Professional/bc1q21_Jade_Signed_PSBT_QR_frames (7).txt"
