name: Professional isolated encryption format compatibility
on:
  workflow_dispatch:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/test-offline-encryption-format.mjs'
      - '.github/workflows/professional-offline-encryption-format.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test retail BC1Q21G1 format with synthetic non-wallet data
        run: node Professional/test-offline-encryption-format.mjs
