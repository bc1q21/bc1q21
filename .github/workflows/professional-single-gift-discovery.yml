name: Professional one funded 24-release gift Core regtest discovery
on:
  workflow_dispatch:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/test-single-funded-gift-core.py'
      - 'Professional/verify-one-funded-gift-local-core.mjs'
      - 'Professional/verify-same-gift-recipient-unsigned-psbt.mjs'
      - 'Professional/one-gift-local-regtest-rpc.mjs'
      - '.github/workflows/professional-single-gift-discovery.yml'
permissions:
  contents: read
jobs:
  real-core-regtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned BIP32 public fixture derivation library
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional @scure/bip32@1.7.0
      - name: Generate synthetic public xpub release descriptors
        run: node Professional/build-watchonly-public-fixture.mjs "$RUNNER_TEMP/public-gift-input.json"
      - name: Install independent Bitcoin transaction decoder (test only)
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @scure/bip32@1.7.0 @noble/curves@1.9.7
      - name: Start entirely disposable Bitcoin Core 28 regtest
        run: |
          set -euo pipefail
          docker pull bitcoin/bitcoin:28.0
          mkdir -p "$RUNNER_TEMP/single-gift-bitcoin"
          docker run -d --name bc1q21-single-gift --network host -v "$RUNNER_TEMP/single-gift-bitcoin:/work" --entrypoint bitcoind bitcoin/bitcoin:28.0 -datadir=/work -regtest -server -rpcuser=regtest -rpcpassword=disposable -fallbackfee=0.0001 -txindex=1 -rpcbind=127.0.0.1 -rpcallowip=127.0.0.1 -printtoconsole=0
          for i in $(seq 1 90); do
            if docker exec bc1q21-single-gift bitcoin-cli -datadir=/work -regtest -rpcuser=regtest -rpcpassword=disposable getblockcount >/dev/null 2>&1; then break; fi
            sleep 2
          done
      - name: Fund one transaction and verify all 24 outputs and gift-link input origin
        run: python3 Professional/test-single-funded-gift-core.py "$RUNNER_TEMP/public-gift-input.json" "$RUNNER_TEMP/single-funded-gift-proof.json"
      - name: Independently inspect same gift against local Bitcoin Core read-only RPC
        run: node Professional/verify-one-funded-gift-local-core.mjs "$RUNNER_TEMP/public-gift-input.json" "$RUNNER_TEMP/single-funded-gift-proof.json"
      - name: Reject premature recipient release for same regtest gift
        run: node Professional/verify-same-gift-recipient-unsigned-psbt.mjs "$RUNNER_TEMP/public-gift-input.json" "$RUNNER_TEMP/single-funded-gift-proof.json" premature
      - name: Advance same isolated regtest chain beyond first release CLTV height
        shell: bash
        run: |
          set -euo pipefail
          MINER=$(docker exec bc1q21-single-gift bitcoin-cli -datadir=/work -regtest -rpcuser=regtest -rpcpassword=disposable -rpcwallet=test-gift-creator getnewaddress)
          docker exec bc1q21-single-gift bitcoin-cli -datadir=/work -regtest -rpcuser=regtest -rpcpassword=disposable generatetoaddress 380 "$MINER" >/dev/null
      - name: Build unsigned recipient PSBT for same confirmed gift after maturity
        run: node Professional/verify-same-gift-recipient-unsigned-psbt.mjs "$RUNNER_TEMP/public-gift-input.json" "$RUNNER_TEMP/single-funded-gift-proof.json" mature
      - name: Upload synthetic public-only verification evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: professional-one-funded-24-release-regtest-proof
          path: ${{ runner.temp }}/single-funded-gift-proof.json
          if-no-files-found: error
          retention-days: 7
