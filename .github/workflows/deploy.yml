name: Deploy to Production

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Block LOCAL SHIM code
        run: |
          if grep -Rni --exclude-dir=.git --exclude-dir=.github "LOCAL SHIM" .; then
            echo "::error::Deployment blocked: LOCAL SHIM was found in the repository."
            exit 1
          fi
          echo "LOCAL SHIM check passed."

            - name: Diagnose production Git state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Production Git diagnostics ==="
            echo "SSH user:"
            whoami
            echo "Current branch:"
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo rev-parse --abbrev-ref HEAD
            echo "Current commit:"
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo rev-parse HEAD
            echo "Latest local commit:"
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo log -1 --oneline
            echo "Working tree status:"
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo status --short --branch
            echo "=== End diagnostics ==="
            
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo /usr/local/bin/bc1q21-deploy.sh
