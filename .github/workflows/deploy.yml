name: Deploy to Production

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Block LOCAL SHIM code
        run: |
          if grep -Rni --exclude-dir=.git --exclude-dir=.github "LOCAL SHIM" .; then
            echo "::error::Deployment blocked: LOCAL SHIM was found in the repository."
            exit 1
          fi
          echo "LOCAL SHIM check passed."

      - name: Remove confirmed zero-byte production artifacts
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "=== Production Git realignment ==="
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo fetch origin
            echo "Current production HEAD:"
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo rev-parse HEAD
            echo "Fresh origin/main:"
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo rev-parse origin/main
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo reset --hard origin/main
            echo "=== Production Git status after realignment ==="
            git -c safe.directory=/opt/bc1q21/repo -C /opt/bc1q21/repo status --short --branch
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo /usr/local/bin/bc1q21-deploy.sh
