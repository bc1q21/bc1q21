name: Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Block LOCAL SHIM code
        run: |
          if grep -Rni --exclude-dir=.git --exclude-dir=.github "LOCAL SHIM" .; then
            echo "::error::Deployment blocked: LOCAL SHIM was found in the repository."
            exit 1
          fi
          echo "LOCAL SHIM check passed."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:TyUuu25Hg/15qqPdecb2Em4SUpPaOAyN50weJr3VLiE
          script: |
            /usr/local/bin/bc1q21-deploy.sh "${{ github.sha }}"
