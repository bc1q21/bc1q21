name: Inspect Production Nginx

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read production nginx configuration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== ACTIVE BC1Q21 NGINX SITE ==="
            sudo cat /etc/nginx/sites-enabled/bc1q21

            echo
            echo "=== RATE LIMIT DIRECTIVES FOUND BY NGINX ==="
            sudo nginx -T 2>&1 | grep -nE 'limit_req|limit_conn|limit_req_zone|limit_conn_zone' || true
