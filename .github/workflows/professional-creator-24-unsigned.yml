name: Professional creator unsigned 24
on:
  workflow_dispatch:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/build-creator-24-unsigned-core.py'
      - '.github/workflows/professional-creator-24-unsigned.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional @scure/bip32@1.7.0
      - run: node Professional/build-watchonly-public-fixture.mjs "$RUNNER_TEMP/public.json"
      - run: |
          docker pull bitcoin/bitcoin:28.0
          mkdir -p "$RUNNER_TEMP/core"
          docker run -d --name bc1q21-creator-psbt --network none -v "$RUNNER_TEMP/core:/work" --entrypoint bitcoind bitcoin/bitcoin:28.0 -datadir=/work -regtest -server -rpcuser=regtest -rpcpassword=disposable -fallbackfee=0.0001 -printtoconsole=0
          for i in $(seq 1 90); do
            docker exec bc1q21-creator-psbt bitcoin-cli -datadir=/work -regtest -rpcuser=regtest -rpcpassword=disposable getblockcount && break
            sleep 2
          done
      - run: python3 Professional/build-creator-24-unsigned-core.py "$RUNNER_TEMP/public.json" "$RUNNER_TEMP/creator.json"
      - uses: actions/upload-artifact@v4
        with:
          name: professional-creator-24-unsigned-regtest
          path: ${{ runner.temp }}/creator.json
          retention-days: 7
