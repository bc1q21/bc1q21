name: Professional synthetic recovery envelope tests
on:
  workflow_dispatch:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/test-recovery-envelope-synthetic.mjs'
      - '.github/workflows/professional-recovery-envelope.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate synthetic recovery for 1, 4 and 24 gift releases
        run: node Professional/test-recovery-envelope-synthetic.mjs
