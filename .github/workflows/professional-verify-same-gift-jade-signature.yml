name: Professional verify captured same gift Jade hardware signature
on:
  workflow_dispatch:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/verify-same-gift-jade-signed-qr.mjs'
      - 'Professional/jade-same-gift-release1-signed-qr-capture-2026-10-20.txt'
      - '.github/workflows/professional-verify-same-gift-jade-signature.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-jade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned verifier libraries
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @ngraveio/bc-ur@1.1.13 cbor@9.0.2 @noble/curves@1.9.7
      - name: Retrieve exact already-funded Jade-key regtest gift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input"
          gh run download 39472333991 --repo "$GITHUB_REPOSITORY" --name professional-one-funded-24-release-regtest-proof --dir "$RUNNER_TEMP/input"
      - name: Verify captured Jade signed QR, matching unsigned PSBT and ECDSA
        run: node Professional/verify-same-gift-jade-signed-qr.mjs "Professional/jade-same-gift-release1-signed-qr-capture-2026-10-20.txt" "$RUNNER_TEMP/input/same-gift-unsigned-handoff.json"
