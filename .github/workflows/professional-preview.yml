name: Professional browser preview package (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - professional/isolated-release-prototype
    paths:
      - 'Professional/**'
      - '.github/workflows/professional-preview.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out isolated Professional branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node for isolated Professional signing-gate tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated test-only PSBT dependency
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @ngraveio/bc-ur@1.1.13 @noble/curves@1.9.7 jsqr@1.4.0
      - name: Test funded intent and unsigned Jade PSBT construction
        run: |
          node --test Professional/funded-distribution-intent.test.mjs Professional/unsigned-funded-distribution-psbt.test.mjs Professional/unsigned-distribution-jade-qr.test.mjs Professional/verify-signed-funded-distribution.test.mjs Professional/creator-signed-qr-verification-gate.test.mjs Professional/creator-signed-qr-camera.test.mjs Professional/gift-edit-gate.test.mjs Professional/inspect-funded-distribution-core.test.mjs
      - name: Build isolated Professional browser verifier bundle
        run: |
          npm install --no-package-lock --ignore-scripts --prefix Professional/browser-integration
          (cd Professional/browser-integration && npm run build)
          test -s Professional/browser-integration/professional-verifier.bundle.js
          grep -q 'bc1q21ProfessionalAttachCreatorCamera' Professional/browser-integration/professional-verifier.bundle.js
      - name: Prepare self-contained preview folder
        run: |
          mkdir -p preview
          cp -R Professional Frontend preview/
          cat > preview/START-HERE.txt <<'EOF'
          bc1q21 Professional — DEVELOPMENT PREVIEW ONLY

          This package is NOT a live website and must NEVER be used with real Bitcoin.
          Retail recovery/funding/broadcast remain blocked in the Professional mirror.
          Do not use real seed words or private keys.

          1. Extract the archive.
          2. Open a terminal in the extracted preview folder.
          3. Run: python -m http.server 8765 --bind 127.0.0.1
          4. Open http://127.0.0.1:8765/Professional/index.html in your browser.
          5. Stop the server with Ctrl+C when finished.

          You need Python installed for this local preview.
          EOF
      - name: Check preview entry point and required local assets
        run: |
          test -s preview/Professional/index.html
          test -s preview/Professional/retail-mirror/index.html
          test -s preview/Professional/professional-creator-prototype.html
          test -s preview/Professional/recipient-gift-specific-prototype.html
          test -s preview/Professional/retail-plan-bridge.mjs
          test -s preview/Professional/gift-edit-gate.mjs
          test -s preview/Frontend/NavigationManager.js
          test -s preview/Frontend/static/style.css
          grep -q "connect-src 'self'; form-action 'none'" preview/Professional/retail-mirror/index.html
          grep -q 'LOCAL DEVELOPMENT PREVIEW' preview/Professional/retail-mirror/index.html
      - name: Upload offline browser preview (no deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bc1q21-professional-browser-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
