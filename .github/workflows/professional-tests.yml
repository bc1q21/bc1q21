name: Professional isolated PSBT tests

on:
  push:
    branches:
      - professional/isolated-release-prototype
    paths:
      - 'Professional/**'
      - '.github/workflows/professional-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-psbt-tests:
    name: Offline PSBT tests (no secrets or network calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run isolated tests
        run: node --test Professional/*.test.mjs
      - name: Install independent compatibility checker (test-only)
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @ngraveio/bc-ur@1.1.13
      - name: Verify PSBT with independent Bitcoin library
        run: node --test Professional/bitcoinjs-compatibility.check.mjs Professional/qr-handoff.check.mjs Professional/crypto-psbt-frames.check.mjs
