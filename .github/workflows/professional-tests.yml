name: Professional isolated PSBT tests

on:
  push:
    branches:
      - professional/isolated-release-prototype
    paths:
      - 'Professional/**'
      - '.github/workflows/professional-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-psbt-tests:
    name: Offline PSBT tests (no secrets or network calls)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run isolated tests
        run: node --test Professional/*.test.mjs
      - name: Install independent compatibility checker (test-only)
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix Professional bitcoinjs-lib@6.1.7 @ngraveio/bc-ur@1.1.13 qrcode@1.5.4 esbuild@0.25.12 jsqr@1.4.0 buffer@6.0.3 @noble/curves@1.9.7 playwright@1.58.2 bip32@5.0.0 tiny-secp256k1@2.2.4
      - name: Verify Professional recipient public integration boundary
        run: node --test Professional/recipient-integration-boundary.check.mjs Professional/recipient-integration-evidence.check.mjs
      - name: Verify one-gift funding transaction binding
        run: node --test Professional/one-gift-raw-funding-binding.check.mjs
      - name: Verify one-gift Bitcoin Core UTXO continuity
        run: node --test Professional/one-gift-core-utxo-continuity.check.mjs
      - name: Verify integrated one-gift funding and Core consistency (untrusted observations)
        run: node --test Professional/one-gift-integrated-funding.check.mjs
      - name: Verify bounded read-only local regtest RPC acquisition guard
        run: node --test Professional/one-gift-local-regtest-rpc.check.mjs
      - name: Verify external same-gift signed-return remains fail closed
        run: node --test Professional/same-gift-external-signed-return.check.mjs      
      - name: Verify PSBT with independent Bitcoin library
        run: node --test Professional/bitcoinjs-compatibility.check.mjs Professional/qr-handoff.check.mjs Professional/crypto-psbt-frames.check.mjs Professional/verify-synthetic-signed-psbt.check.mjs Professional/finalize-synthetic-cltv.check.mjs Professional/independent-cltv-script-validation.check.mjs Professional/public-handoff.check.mjs Professional/public-funding-release-integration.check.mjs Professional/jade-xpub-cltv-handoff.check.mjs Professional/public-boundary-regression.check.mjs Professional/transaction-intent-regression.check.mjs Professional/approved-release-gate.check.mjs Professional/transaction-confirmation.check.mjs Professional/confirmation-session.check.mjs Professional/approved-psbt-handoff.check.mjs Professional/one-time-approved-handoff.check.mjs Professional/full-confirmed-release-flow.check.mjs Professional/controlled-qr-session.check.mjs Professional/controlled-qr-boundary.check.mjs Professional/verify-signed-psbt-return.check.mjs Professional/verify-returned-signature.check.mjs Professional/cltv-signed-return-negative.check.mjs Professional/finalize-verified-release.check.mjs Professional/audit-finalized-transaction.check.mjs Professional/finalize-and-audit-release.check.mjs Professional/controlled-signed-return.check.mjs Professional/hostile-signed-psbt-metadata.check.mjs Professional/in-memory-replay-guard.check.mjs Professional/local-durable-replay-guard.check.mjs
      - name: Verify captured Jade Plus V7 synthetic signing and CLTV finalization
        run: node --test Professional/jade-v7-captured-signed-cltv.check.mjs
      - name: Run retail-parity and offline schedule regression checks
        run: node --test Professional/offline-retail-date-decrypt.check.mjs Professional/retail-aes-interoperability.check.mjs Professional/retail-calendar-cltv.check.mjs Professional/public-retail-schedule-verify.check.mjs Professional/public-schedule-return.check.mjs Professional/public-schedule-session-gate.check.mjs Professional/durable-public-schedule-gate.check.mjs Professional/file-durable-nonce-store.check.mjs Professional/file-durable-schedule-integration.check.mjs Professional/pinned-offline-schedule-response.check.mjs Professional/pinned-durable-schedule-return-gate.check.mjs Professional/synthetic-offline-schedule-compose.check.mjs Professional/synthetic-offline-unlock-pipeline.check.mjs Professional/disposable-bip39-retail-secret-fixture.check.mjs Professional/independent-bip32-retail-secret.check.mjs Professional/public-exchange-envelope.check.mjs Professional/public-gift-distribution-accounting.check.mjs Professional/signed-gift-output-intent-check.check.mjs Professional/trusted-utxo-snapshot-check.check.mjs Professional/gift-distribution-snapshot-gate.check.mjs Professional/bitcoin-core-gettxout-adapter.check.mjs Professional/gift-distribution-core-response-gate.check.mjs Professional/public-multi-release-gift-integration.check.mjs Professional/disposable-wallet-retail-date-interoperability.check.mjs Professional/disposable-encrypted-four-release-flow.check.mjs Professional/public-device-comparison-vectors.check.mjs Professional/public-device-cltv-observation-check.check.mjs
      - name: Build offline Jade public QR format diagnostic
        run: node Professional/build-jade-public-qr-format.mjs Professional/jade-public-qr-format.html
      - name: Verify public QR diagnostic packaging
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=fs.readFileSync("Professional/jade-public-qr-format.html","utf8"); for (const good of ["Start camera","getUserMedia","DISPOSABLE TEST WALLET ONLY","Export XPub"]) assert.ok(s.includes(good),good); for (const bad of ["<script src=","<link href=","XMLHttpRequest","WebSocket","fetch("]) assert.ok(!s.includes(bad),bad); console.log("Offline public QR diagnostic packaged",s.length,"bytes")'
      - name: Publish offline Jade public QR format diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: professional-jade-public-qr-format
          path: Professional/jade-public-qr-format.html
          if-no-files-found: error
          retention-days: 7
      - name: Generate standalone public-only handoff demonstration
        run: node Professional/build-public-handoff-demo.mjs Professional/synthetic-public-handoff-demo.html
      - name: Verify standalone public-only handoff demonstration
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=fs.readFileSync("Professional/synthetic-public-handoff-demo.html","utf8"); for (const good of ["public-only wallet handoff", "SYNTHETIC / REGTEST / UNFUNDED TEST ONLY", "Unsigned PSBT", "ScriptPubKey"]) assert.ok(s.includes(good),good); for (const bad of ["<script", "<form", "fetch(", "WebSocket", "XMLHttpRequest"]) assert.ok(!s.includes(bad),bad); console.log("Offline public handoff demo verified",s.length,"bytes")'
      - name: Publish public-only handoff demonstration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: professional-synthetic-public-handoff-demo
          path: Professional/synthetic-public-handoff-demo.html
          if-no-files-found: error
          retention-days: 7
      - name: Generate offline regtest transaction confirmation demonstration
        run: node Professional/build-transaction-confirmation-demo.mjs Professional/synthetic-transaction-confirmation.html
      - name: Verify offline confirmation requires explicit acknowledgment
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=fs.readFileSync("Professional/synthetic-transaction-confirmation.html","utf8"); for (const good of ["DISPOSABLE REGTEST DEMO ONLY","Not approved.","button.disabled","ack.checked","digest.value.trim()===expected","No signing or broadcasting performed."]) assert.ok(s.includes(good),good); for (const bad of ["<script src=","<link href=","XMLHttpRequest","WebSocket","fetch("]) assert.ok(!s.includes(bad),bad); console.log("Offline confirmation demo verified",s.length,"bytes")'
      - name: Install Chromium for isolated browser regression
        run: npx --prefix Professional playwright install --with-deps chromium
      - name: Exercise confirmation screen in real Chromium
        run: node Professional/confirmation-browser.check.mjs
      - name: Publish offline transaction confirmation demonstration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: professional-regtest-transaction-confirmation
          path: Professional/synthetic-transaction-confirmation.html
          if-no-files-found: error
          retention-days: 7
      - name: Generate standalone offline synthetic animated QR page
        run: node Professional/build-qr-demo.mjs Professional/synthetic-jade-qr-demo.html
      - name: Verify standalone demo has embedded QR images and no remote assets
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=fs.readFileSync("Professional/synthetic-jade-qr-demo.html","utf8"); assert.ok(s.includes("data:image/png;base64,")); assert.ok(s.includes("SYNTHETIC / UNFUNDED TEST ONLY")); for (const bad of ["<script src=", "<link href=", "XMLHttpRequest", "WebSocket", "fetch("]) assert.ok(!s.includes(bad), "Unexpected remote asset/API: "+bad); console.log("Offline QR HTML verified",s.length,"bytes")'
      - name: Publish synthetic offline Jade QR demonstration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: professional-synthetic-jade-qr-demo
          path: Professional/synthetic-jade-qr-demo.html
          if-no-files-found: error
          retention-days: 7
      - name: Build synthetic Jade signed QR receiver
        run: node Professional/build-signed-qr-receiver.mjs Professional/synthetic-jade-signed-qr-receiver.html
      - name: Verify offline signed QR receiver packaging
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const s=fs.readFileSync("Professional/synthetic-jade-signed-qr-receiver.html","utf8"); for (const good of ["Start camera","getUserMedia","jade-synthetic-signed.psbt","SYNTHETIC / UNFUNDED TEST ONLY"]) assert.ok(s.includes(good),good); for (const bad of ["<script src=","<link href=","XMLHttpRequest","WebSocket"]) assert.ok(!s.includes(bad),bad); console.log("Signed QR receiver packaged",s.length,"bytes")'
      - name: Smoke-test receiver browser initialization
        run: node Professional/check-receiver-browser-startup.mjs
      - name: Publish synthetic signed Jade QR receiver
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: professional-synthetic-jade-signed-qr-receiver
          path: Professional/synthetic-jade-signed-qr-receiver.html
          if-no-files-found: error
          retention-days: 7
