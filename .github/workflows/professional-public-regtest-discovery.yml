name: Professional public regtest release discovery audit
on:
  workflow_dispatch:
  push:
    branches: [professional/isolated-release-prototype]
    paths:
      - 'Professional/audit-public-regtest-outpoints.py'
      - '.github/workflows/professional-public-regtest-discovery.yml'
permissions:
  contents: read
  actions: read
jobs:
  public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore verified disposable public regtest snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input" "$RUNNER_TEMP/node/regtest"
          gh run download 39048374200 --repo "$GITHUB_REPOSITORY" --name professional-four-jade-public-unsigned-regtest --dir "$RUNNER_TEMP/input"
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'input/four-jade-snapshot'
          m=json.loads((root/'manifest.json').read_text())
          assert m['network']=='regtest'
          for x in m['files']:
              b=(root/x['path']).read_bytes()
              assert len(b)==x['size'] and hashlib.sha256(b).hexdigest()==x['sha256'],x['path']
          print('PASS verified snapshot manifest and file hashes')
          PY
          cp -a "$RUNNER_TEMP/input/four-jade-snapshot/blocks" "$RUNNER_TEMP/node/regtest/"
          cp -a "$RUNNER_TEMP/input/four-jade-snapshot/chainstate" "$RUNNER_TEMP/node/regtest/"
      - name: Start network-isolated Bitcoin Core 28
        run: |
          set -euo pipefail
          docker pull bitcoin/bitcoin:28.0
          docker run -d --name bc1q21-public-discovery --network none -v "$RUNNER_TEMP/node:/work" --entrypoint bitcoind bitcoin/bitcoin:28.0 -datadir=/work -regtest -server -rpcuser=regtest -rpcpassword=disposable -txindex=1 -printtoconsole=0
          for i in $(seq 1 90); do
            if docker exec bc1q21-public-discovery bitcoin-cli -datadir=/work -regtest -rpcuser=regtest -rpcpassword=disposable getblockcount >/dev/null 2>&1; then break; fi
            sleep 2
          done
          test "$(docker exec bc1q21-public-discovery bitcoin-cli -datadir=/work -regtest -rpcuser=regtest -rpcpassword=disposable getblockcount)" = 121
      - name: Independently inspect four public gift outputs
        run: |
          set -euo pipefail
          python3 Professional/audit-public-regtest-outpoints.py "$RUNNER_TEMP/input/four-jade-public-unsigned.json" "$RUNNER_TEMP/public-outpoints-audit.json"
      - name: Preserve public-only audit evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: professional-public-regtest-outpoint-audit
          path: ${{ runner.temp }}/public-outpoints-audit.json
          if-no-files-found: error
          retention-days: 7
