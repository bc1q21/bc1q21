# bc1q21 production nginx reference configuration
#
# Repository reference for the production nginx configuration.
#
# Production locations:
#   Main nginx configuration: /etc/nginx/nginx.conf
#   Site configuration:       /etc/nginx/sites-available/bc1q21
#   Enabled site symlink:     /etc/nginx/sites-enabled/bc1q21
#
# IMPORTANT:
# The limit_req_zone directives below belong in the nginx http {} context.
# The server blocks belong in the site configuration.
# Do not copy this entire reference file directly into sites-enabled.
# Validate production changes with `nginx -t` before reloading nginx.


# ---------------------------------------------------------------------------
# Rate-limit zones
# Production location: /etc/nginx/nginx.conf inside http {}
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=scan_utxos:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_expensive:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=contact_form:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=csp_reports:10m rate=10r/m;


# ---------------------------------------------------------------------------
# HTTP: allow ACME challenge and redirect everything else to HTTPS
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name bc1q21.com www.bc1q21.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.bc1q21.com$request_uri;
    }
}


# ---------------------------------------------------------------------------
# HTTPS: website + application + backend
# ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name bc1q21.com;

    ssl_certificate /etc/letsencrypt/live/bc1q21.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bc1q21.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.bc1q21.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.bc1q21.com;

    ssl_certificate /etc/letsencrypt/live/bc1q21.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bc1q21.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    server_tokens off;
    charset utf-8;


    # -----------------------------------------------------------------------
    # Website at /
    # -----------------------------------------------------------------------

    location / {
        root /var/www/bc1q21/site;
        index index.html;
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Reporting-Endpoints "csp=\"https://$host/bitcoin/csp-report\"" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://ajax.googleapis.com https://d3e54v103j8qbb.cloudfront.net 'sha256-eBPmpdihmky5O3Fn3f98gLo1XfgR4FvEks3E51S2zPw=' 'sha256-mjdgHR9aXy+6OwAGlNS/XgNcYG1Uhd2U4pl8vi7+XCY=' 'sha256-mFcUScKNWErYxh3x8blHe+493toOYPaKoeeHqtcRPXU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://d3e54v103j8qbb.cloudfront.net; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /bitcoin/csp-report; report-to csp;" always;
    }


    # -----------------------------------------------------------------------
    # Documents (PDFs embedded in iframes)
    # -----------------------------------------------------------------------

    location ^~ /doc/ {
        root /var/www/bc1q21/site;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Reporting-Endpoints "csp=\"https://$host/bitcoin/csp-report\"" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://bc1q21.com https://www.bc1q21.com; report-uri /bitcoin/csp-report; report-to csp;" always;
    }


    # -----------------------------------------------------------------------
    # Canonical application URLs
    # -----------------------------------------------------------------------

    location = /app/gift {
        return 301 /app/gift/;
    }

    location = /app {
        return 301 /app/;
    }


    # -----------------------------------------------------------------------
    # Gift recipient page at /app/gift/
    # -----------------------------------------------------------------------

    location ^~ /app/gift/ {
        root /var/www/bc1q21;
        index index.html;
        try_files $uri $uri/ /app/gift/index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Reporting-Endpoints "csp=\"https://$host/bitcoin/csp-report\"" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha384-FQqpbQ0NG5vgtmaGgzOiPF1nN0o8WjvHHnGWTpA7XCt4hyh6y9O0f4O/rOGlC7YZ' 'sha384-hj+IFULD7FD6Fz1kM4zy39/f1Nn24yWzB9JIBJrUlh9qBafp0zGXKTO3jhuvAJwm'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /bitcoin/csp-report; report-to csp;" always;
    }


    # -----------------------------------------------------------------------
    # Application at /app/
    # -----------------------------------------------------------------------

    location ^~ /app/ {
        root /var/www/bc1q21;
        index index.html;
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Reporting-Endpoints "csp=\"https://$host/bitcoin/csp-report\"" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha384-wECK+ws5puLUM1Km51Nfi+MMJlIMIiaC3r8CaMQHGZxzxptVWB7YzWgn6TSDziic'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' https://www.bc1q21.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests; report-uri /bitcoin/csp-report; report-to csp;" always;
    }


    # -----------------------------------------------------------------------
    # Backend at /bitcoin/
    # -----------------------------------------------------------------------

    location ^~ /bitcoin/ {
        limit_req zone=api_general burst=20 nodelay;

        location = /bitcoin/csp-report {
            limit_req zone=csp_reports burst=20 nodelay;
            client_max_body_size 16k;
            access_log off;

            proxy_pass http://127.0.0.1:8000/bitcoin/csp-report;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_redirect off;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location = /bitcoin/contact {
            limit_req zone=contact_form burst=2 nodelay;
            proxy_pass http://127.0.0.1:8000/bitcoin/contact;
        }

        location = /bitcoin/giftcard.pdf {
            limit_req zone=api_expensive burst=2 nodelay;
            proxy_pass http://127.0.0.1:8000/bitcoin/giftcard.pdf;
        }

        location = /bitcoin/scan-utxos {
            limit_req zone=scan_utxos burst=2 nodelay;
            proxy_pass http://127.0.0.1:8000/bitcoin/scan-utxos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        proxy_pass http://127.0.0.1:8000/bitcoin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;

        # Never cache API responses
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
