<!DOCTYPE html>
<html>
<head>  
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-lRMRl0TgIwh9vFMbX4SreUmdU9cGb1FmzhYp0fAvBQk='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
  <title>Sign CLTV Transaction</title>
<script type="text/javascript" src="coinbin/js/crypto-min.js" integrity="sha384-QA6ETmyfFX/Dp/6Pgyjf83hQ/FqUQZI30gWOBiddzsNgKo7ujhkABM7CqOqCN5iv"></script>
<script type="text/javascript" src="coinbin/js/crypto-sha256.js" integrity="sha384-OVBTDRfeBIhqF/Oh4hyDBEyshU9kjVnJ5KRcowXUkJWXmPh9qPdZSOlJVmz3to+B"></script>
<script type="text/javascript" src="coinbin/js/crypto-sha256-hmac.js" integrity="sha384-YSPnpU4IfdDYrBxKPVyuLHsKuoeLO5FgwXu//zaHMxGDCwNzTBUsA0D1VMmuAv0q"></script>
<script type="text/javascript" src="coinbin/js/sha512.js" integrity="sha384-G+ZrHNE8IX80vHFXIwBFMBz8JOO44fUdOfIt2Wj/eYdfW9PlB3RUka5YB/cM8zl2"></script>
<script type="text/javascript" src="coinbin/js/ripemd160.js" integrity="sha384-xRbUfo/iPIRdqezE32enNVKz3tRstdNnKZf7iGJAUD/3kbbQ3YGe45ncJlfCbAPB"></script>
<script type="text/javascript" src="coinbin/js/aes.js" integrity="sha384-YkYpnhy3j3+zc3fQvzlbh4WGwDgt+06gsGsaApwM1O3IKIsKJk61C0Lr6YvbovUV"></script>

<script type="text/javascript" src="coinbin/js/jsbn.js" integrity="sha384-4kAktv1oqWFrGlpPdLiR8uZZYDFsVs3DA7t799VdbBZnO/tmkVd8euBMFKEzQTh/"></script>
<script type="text/javascript" src="coinbin/js/ellipticcurve.js" integrity="sha384-Ggi2jZYak8oq8ARmopHQyrbald3onMvc57YpK13hHbnVmAHPV27jLrnqFr9SYHzk"></script>
<script type="text/javascript" src="coinbin/js/coin.js" integrity="sha384-7yj0N3l9stShkxotxd/AJYp2tSaR5rdW5E+jodv8OnAN8fkKdnzP+K/A69ov3zrT"></script>
  <script>
  function signCltvTransaction(unsignedTxHex, wif, redeemScript) {
      try {
            const tx = coinjs.transaction();
            const txUnserialized = tx.deserialize(unsignedTxHex);
            console.log("signCltvTransaction unsignedTxHex:", unsignedTxHex);

            if (!txUnserialized || !txUnserialized.ins || txUnserialized.ins.length === 0) {
            throw new Error("Invalid or empty transaction inputs.");
            }

            const signedTx = txUnserialized.signhodl(0, wif, 1);
            const output = txUnserialized.serialize();
            console.log("signCltvTransaction output", output);
            console.log("signCltvTransaction output.size", txUnserialized.size());
            return output;
        } catch (err) {
            console.error("Error signing CLTV transaction:", err);
            return "Error: " + err.message;
        }
    }

    function signCltvTransaction2(unsignedTxHex, wif, redeemScript) {
      try {
        const tx = coinjs.transaction();
        const txUnserialized = tx.deserialize(unsignedTxHex);
        const signedTx = txUnserialized.signhodl(wif, redeemScript, 0);
        return signedTx;
      } catch (err) {
        console.error("Error signing CLTV transaction:", err);
        return "Error: " + err;
      }
    }

    function runSigning() {
      const wif = document.getElementById('wif').value.trim();
      const unsignedTx = document.getElementById('unsigned').value.trim();
      const redeemScript = document.getElementById('redeem').value.trim();

      const result = signCltvTransaction(unsignedTx, wif, redeemScript);
      document.getElementById('signed').value = result;
    }
        document.getElementById('signBtn').addEventListener('click', runSigning);
  </script>
</head>
<body>
  <h3>WIF Private Key</h3>
  <input type="text" id="wif" style="width:100%" value="ENTER_WIF_PRIVATE_KEY_HERE" spellcheck="false" autocomplete="off" autocapitalize="none" autocorrect="off">

  <h3>Unsigned Transaction (Hex)</h3>
  <textarea id="unsigned" rows="5" style="width:100%">ENTER_UNSIGNED_TRANSACTION_HEX_HERE</textarea>

  <h3>Redeem Script (Hex)</h3>
  <input type="text" id="redeem" style="width:100%" value="ENTER_REDEEM_SCRIPT_HEX_HERE">

  <br><br>
<button id="signBtn">Sign Transaction</button>

  <h3>Signed Transaction (Hex)</h3>
  <textarea id="signed" rows="5" style="width:100%"></textarea>
</body>
</html>
