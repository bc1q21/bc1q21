<!DOCTYPE html>
<html>
<head>  
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-afcwFgntYjBIdbgy7dXJFZ+ri+POI6nfgY5SuHYjk9E='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
  <title>Create Unsigned CLTV TX</title>

  <!-- Coinbin dependencies -->
<script src="coinbin/js/crypto-min.js" integrity="sha384-QA6ETmyfFX/Dp/6Pgyjf83hQ/FqUQZI30gWOBiddzsNgKo7ujhkABM7CqOqCN5iv"></script>
<script src="coinbin/js/crypto-sha256.js" integrity="sha384-OVBTDRfeBIhqF/Oh4hyDBEyshU9kjVnJ5KRcowXUkJWXmPh9qPdZSOlJVmz3to+B"></script>
<script src="coinbin/js/crypto-sha256-hmac.js" integrity="sha384-YSPnpU4IfdDYrBxKPVyuLHsKuoeLO5FgwXu//zaHMxGDCwNzTBUsA0D1VMmuAv0q"></script>
<script src="coinbin/js/sha512.js" integrity="sha384-G+ZrHNE8IX80vHFXIwBFMBz8JOO44fUdOfIt2Wj/eYdfW9PlB3RUka5YB/cM8zl2"></script>
<script src="coinbin/js/ripemd160.js" integrity="sha384-xRbUfo/iPIRdqezE32enNVKz3tRstdNnKZf7iGJAUD/3kbbQ3YGe45ncJlfCbAPB"></script>
<script src="coinbin/js/aes.js" integrity="sha384-YkYpnhy3j3+zc3fQvzlbh4WGwDgt+06gsGsaApwM1O3IKIsKJk61C0Lr6YvbovUV"></script>
<script src="coinbin/js/jsbn.js" integrity="sha384-4kAktv1oqWFrGlpPdLiR8uZZYDFsVs3DA7t799VdbBZnO/tmkVd8euBMFKEzQTh/"></script>
<script src="coinbin/js/ellipticcurve.js" integrity="sha384-Ggi2jZYak8oq8ARmopHQyrbald3onMvc57YpK13hHbnVmAHPV27jLrnqFr9SYHzk"></script>
<script src="coinbin/js/coin.js" integrity="sha384-7yj0N3l9stShkxotxd/AJYp2tSaR5rdW5E+jodv8OnAN8fkKdnzP+K/A69ov3zrT"></script>
  <script>
    function createUnsignedCltvTx() {
      try {
        const redeemScript = document.getElementById('redeem').value.trim();
        const txid = document.getElementById('txid').value.trim();
        const txn = parseInt(document.getElementById('txn').value.trim(), 10) || 0;
        const inputAmount = parseInt(document.getElementById('inputAmount').value.trim(), 10);
        const destAddress = document.getElementById('destAddress').value.trim();
        const destAmount = parseFloat(document.getElementById('destAmount').value.trim(), 10);
        const lockTime = parseInt(document.getElementById('lockTime').value.trim(), 10);

        const tx = coinjs.transaction();
        tx.lock_time = lockTime; // user-supplied CLTV locktime
        
        // Add input (spending from CLTV UTXO)
        tx.addinput(txid, txn, redeemScript, 0xffffffff - 2); // use nSequence = 0xfffffffe to enable CLTV

        // Add output (sending to a P2WPKH address or P2PKH)
        tx.addoutput(destAddress, destAmount);


        const unsignedHex = tx.serialize();
        document.getElementById('unsignedTx').value = unsignedHex;

        console.log("Unsigned TX:", unsignedHex);
      } catch (err) {
        console.error("Error creating unsigned TX:", err);
        document.getElementById('unsignedTx').value = "Error: " + err.message;
      }
    }
        document.getElementById('createTxBtn').addEventListener('click', createUnsignedCltvTx);
  </script>
</head>
<body>
  <h3>Redeem Script (Hex)</h3>
  <input type="text" id="redeem" style="width:100%" value="ENTER_REDEEM_SCRIPT_HEX_HERE">

  <h3>Input TXID</h3>
  <input type="text" id="txid" style="width:100%" value="ENTER_INPUT_TXID_HERE">
  
  <h3>TX Index (N)</h3>
  <input type="number" id="txn" style="width:100%" value="0">
  <h3>CLTV Locktime (Unix Timestamp)</h3>
<input type="number" id="lockTime" style="width:100%" placeholder="ENTER_CLTV_LOCKTIME_HERE">

  <h3>Input Amount (BTC)</h3>
  <input type="number" id="inputAmount" style="width:100%" placeholder="ENTER_INPUT_AMOUNT_BTC_HERE">
  
  <h3>Destination Address</h3>
  <input type="text" id="destAddress" style="width:100%" value="ENTER_DESTINATION_ADDRESS_HERE">
  
  <h3>Destination Amount (BTC)</h3>
  <input type="number" id="destAmount" style="width:100%" placeholder="ENTER_DESTINATION_AMOUNT_BTC_HERE">
  
  <br><br>
<button id="createTxBtn">Create Unsigned TX</button>
  
  <h3>Unsigned TX (Hex)</h3>
  <textarea id="unsignedTx" rows="5" style="width:100%"></textarea>
</body>
</html>
